name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Validate public content and committed audio
        run: node scripts/validate_content.mjs --require-audio

      - name: Run privacy and secret gate
        run: node scripts/privacy_gate.mjs

      - name: Check trilingual README structure
        run: npm run docs:check

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Check audio generator syntax
        run: python -m py_compile scripts/generate_audio.py

      - name: Lint application
        run: npm run lint

      - name: Build GitHub Pages edition
        env:
          PAGES_BASE: /
        run: npm run build:pages

      - name: Verify GitHub Pages artifact
        run: node scripts/verify_pages_build.mjs --base /

      - name: Build GPT Sites edition
        run: npm run build
